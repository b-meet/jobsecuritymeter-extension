name: Protect master

# master must only change through a reviewed pull request.
#
# This workflow is a DETECTIVE control: it cannot reject a push, but it fails
# loudly and opens an issue whenever a commit lands on master without an
# associated merged pull request. A smuggled loader was committed straight to
# this repo's history before; this check exists so that cannot pass silently.
#
# Pair this with the local pre-commit hook (.githooks/pre-commit), the
# preventive half that blocks a payload at commit time.
#
# NOTE: this repository is public, so it also qualifies for GitHub's free
# branch protection / rulesets - enable "Require a pull request before merging"
# on master for a true preventive control, and keep this as backup.

on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  require-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the commit arrived via a merged pull request
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
            const merged = prs.find((pr) => pr.merged_at);
            if (merged) {
              core.info(`OK: ${sha} arrived via merged PR #${merged.number}.`);
              return;
            }
            const actor = context.actor;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Direct push to master (${sha.substring(0, 7)})`,
              body: [
                'A commit landed on `master` with no associated merged pull request.',
                '',
                `- Commit: ${sha}`,
                `- Pushed by: @${actor}`,
                '',
                'master should only change through a reviewed PR that passes the',
                'source-integrity guard. A smuggled loader was committed straight to',
                'master before - this check exists so that never passes silently again.',
                '',
                'If this push was intentional, close this issue. If not, revert the commit.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
            core.setFailed(
              `Direct push to master: ${sha} by @${actor} (no merged PR).`
            );
