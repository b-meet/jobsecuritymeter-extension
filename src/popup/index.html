<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Autofill</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 300px; margin: 0; padding: 16px;
        font: 500 13px/1.45 system-ui, -apple-system, sans-serif;
        background: #f5f1e8; color: #181512;
      }
      h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -0.01em; }
      .sub { color: #6b655d; font-size: 12px; margin: 0 0 14px; }
      button {
        width: 100%; padding: 10px; border: 0; border-radius: 10px;
        font: 700 13px system-ui, sans-serif; cursor: pointer;
        background: #2d5f4f; color: #fff;
      }
      button.ghost { background: transparent; color: #6b655d; font-weight: 600; margin-top: 6px; }
      button:disabled { opacity: .55; cursor: default; }
      .meter { height: 6px; border-radius: 3px; background: #dce9e3; margin: 10px 0 4px; }
      .meter > div { height: 100%; border-radius: 3px; background: #2d5f4f; }
      .msg { margin-top: 10px; font-size: 12px; color: #6b655d; }
    </style>
  </head>
  <body>
    <h1>Job Autofill</h1>
    <p class="sub" id="sub">Checking…</p>
    <div id="body"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
